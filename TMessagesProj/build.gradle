android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        // --- ключи приложения (api_id / api_hash) ---
        // В репозитории их нет. Значения берутся, в порядке приоритета, из:
        //   1) -PAPP_ID=... -PAPP_HASH=... в командной строке,
        //   2) переменных окружения APP_ID / APP_HASH (удобно для CI),
        //   3) файла api.properties в корне проекта (он в .gitignore),
        //   4) local.properties.
        // Шаблон лежит в api.properties.example, см. README → «Сборка».
        buildConfigField "int", "APP_ID", pengramSecret("APP_ID", "0")
        buildConfigField "String", "APP_HASH", "\"" + pengramSecret("APP_HASH", "") + "\""
        buildConfigField "String", "SAFETYNET_KEY", "\"" + pengramSecret("SAFETYNET_KEY", "") + "\""
        buildConfigField "String", "GOOGLE_AUTH_CLIENT_ID", "\"" + pengramSecret("GOOGLE_AUTH_CLIENT_ID", "") + "\""

        // --- паспорт сборки Pengram: его показывает экран «О программе» ---
        buildConfigField "String", "PENGRAM_VERSION", "\"" + pengramVersionName() + "\""
        buildConfigField "int", "PENGRAM_VERSION_CODE", pengramProp("PENGRAM_VERSION_CODE", "1")
        buildConfigField "String", "PENGRAM_BUILD_DATE", "\"" + pengramBuildDate() + "\""
        buildConfigField "String", "PENGRAM_COMMIT", "\"" + pengramCommit() + "\""

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        ndk {
            // Ограничивает список ABI, под которые собирается нативный код.
            //   ./gradlew ... -PABI_FILTERS=arm64-v8a
            def filters = (project.findProperty("ABI_FILTERS") ?: "armeabi-v7a,arm64-v8a,x86,x86_64")
                    .toString().split(",").collect { it.trim() }.findAll { it }
            filters.each { f -> abiFilters f }
        }

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PUBLIC_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "4"
        }

        HA_hardcore {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_HARDCORE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "5"
        }

        standalone {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            // Pengram: код форка уезжает в релиз обфусцированным
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "6"
        }

        release {
            jniDebuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }

    namespace 'org.telegram.messenger'
}


/** значение из gradle.properties / -P / окружения */
def pengramProp(String name, String fallback) {
    def value = project.findProperty(name)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        return fallback
    }
    return value.toString().trim()
}

/** «1.0.0 beta 1» — то, что видит бета-тестер */
def pengramVersionName() {
    def name = pengramProp("PENGRAM_VERSION_NAME", "1.0.0")
    def stage = pengramProp("PENGRAM_VERSION_STAGE", "")
    return stage.isEmpty() ? name : (name + " " + stage)
}

/** дата сборки в UTC: без неё баг-репорты не привязать к сборке */
def pengramBuildDate() {
    def format = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm 'UTC'")
    format.setTimeZone(TimeZone.getTimeZone("UTC"))
    return format.format(new Date())
}

/** короткий хеш коммита: в CI берём из окружения, локально спрашиваем git */
def pengramCommit() {
    def sha = pengramProp("GITHUB_SHA", "")
    if (!sha.isEmpty()) {
        return sha.length() > 7 ? sha.substring(0, 7) : sha
    }
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
            workingDir rootProject.projectDir
        }
        def value = out.toString().trim()
        return value.isEmpty() ? "local" : value
    } catch (Throwable ignore) {
        return "local"
    }
}

def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}

/** Читает файл с ключами, если он есть. Файлы с ключами в репозиторий не попадают. */
def pengramPropsFile(String fileName) {
    def propsFile = rootProject.file(fileName)
    if (!propsFile.exists()) {
        return null
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props
}

/**
 * Секрет сборки: сначала -P, потом переменная окружения, потом api.properties, потом local.properties.
 * Ничего не найдено — возвращаем значение по умолчанию, а checkApiKeys уронит сборку с понятным текстом.
 */
def pengramSecret(String name, String fallback) {
    def value = project.findProperty(name)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = pengramPropsFile('api.properties')?.getProperty(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = pengramPropsFile('local.properties')?.getProperty(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        return fallback
    }
    return value.toString().trim()
}

/**
 * Без api_id/api_hash приложение не залогинится, поэтому падаем на старте сборки,
 * а не ловим «AUTH_KEY» уже в телефоне. Для задач, которые APK не производят
 * (компиляция, lint, тесты), ключи не нужны — там просто предупреждение.
 */
task checkApiKeys {
    doFirst {
        def appId = pengramSecret("APP_ID", "0")
        def appHash = pengramSecret("APP_HASH", "")
        if (appId != "0" && !appHash.isEmpty()) {
            return
        }
        def makesApk = gradle.startParameter.taskNames.any {
            def t = it.toLowerCase()
            t.contains("assemble") || t.contains("bundle") || t.contains("install") || t.contains("package")
        }
        def message = "Не заданы APP_ID / APP_HASH.\n" +
                "Локально: cp api.properties.example api.properties и впишите ключи с https://my.telegram.org\n" +
                "         (или ./gradlew ... -PAPP_ID=12345 -PAPP_HASH=abc...).\n" +
                "GitHub Actions: Settings -> Secrets and variables -> Actions -> New repository secret,\n" +
                "         секреты APP_ID и APP_HASH."
        if (makesApk) {
            throw new GradleException(message)
        }
        logger.warn("\n[Pengram] " + message + "\nСборка продолжится, но собранное приложение не сможет войти в Telegram.\n")
    }
}

preBuild.dependsOn checkApiKeys

apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility
