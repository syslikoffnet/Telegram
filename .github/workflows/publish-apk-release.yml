name: Publish APK Pre-release
on:
  push:
    branches:
      - "arena/11c384e3-telegram"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download signed APK artifact from run #445
        uses: actions/download-artifact@v4
        with:
          run-id: "40717851961"
          name: "Pengram-ARM64-standalone-run-445"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Prepare tag
        id: meta
        run: |
          echo "tag=build-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          find dist -maxdepth 3 -ls

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.idsig
            dist/**/*.apk
            dist/**/*.idsig
          name: "Pengram ${{ steps.meta.outputs.tag }}"
          tag_name: "${{ steps.meta.outputs.tag }}"
          target_commitish: "b258b7a225749cde2a75a21c9966c12804c92d4f"
          body: "Подписанная standalone-сборка Pengram (arm64-v8a, run #445) с обновлённым Помощником ссылок: исправлены островок и кнопка закрытия, добавлена поддержка фото-постов и слайд-шоу со звуком из TikTok, обновлён резолвер YouTube / Shorts / TikTok, добавлены интерактивный предпросмотр и экран настроек."
          prerelease: true
