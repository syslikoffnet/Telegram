name: Build Pengram (Android arm64-v8a)
run-name: "ARM64 APK #${{ github.run_number }} — ${{ github.event.head_commit.message || github.ref_name }}"

# Собирает APK только под arm64-v8a (Poco X6 Pro и любой современный Android).
# Запуск вручную: вкладка Actions -> этот workflow -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        type: choice
        default: standalone
        options:
          - standalone   # подписанная, с оптимизацией (рекомендуется)
          - debug        # без R8, с логами, собирается быстрее
      abi:
        description: "ABI"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - x86_64
          - armeabi-v7a,arm64-v8a
          - armeabi-v7a,arm64-v8a,x86,x86_64
  push:
    branches:
      - "arena/01a10249-telegram"
      - "arena/01a105ae-telegram"
      - "arena/01a10850-telegram"
      - "arena/28564dc4-telegram"
    tags:
      - "build-*"

permissions:
  contents: write

env:
  ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'standalone' }}
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"
  # ccache ускоряет повторную нативную сборку в разы
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: "5G"
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 20

      - name: Build summary
        run: |
          {
            echo "## Pengram ARM64 APK #${GITHUB_RUN_NUMBER}"
            echo
            echo "**Commit:** \`${GITHUB_SHA:0:7}\`"
            echo "**Variant:** standalone · arm64-v8a"
            echo
            echo "### Последние изменения"
            git log -5 --pretty='- %s (`%h`)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/node_modules "/usr/local/share/boost" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "=== after ==="; df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Используем Android SDK, который уже предустановлен на раннере.
      # android-actions/setup-android@v3 здесь падает на --licenses, поэтому
      # лицензии принимаем вручную (записываем хеши) и ставим пакеты сами.
      - name: Configure Android SDK
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV

          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDK"/tools/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

          # принимаем лицензии без интерактива
          mkdir -p "$SDK/licenses"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd 504667f4c0de7af1a06de9f4b1727b84351f2910 > "$SDK/licenses/android-sdk-preview-license"
          printf '%s\n' 33b6a2b64607f11b759f320ef9dff4ae5c47d97a > "$SDK/licenses/android-sdk-arm-dbt-license"

          # ставим всё нужное; если какой-то пакет недоступен — AGP докачает сам
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}" > /dev/null || \
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" || true

          ls "$SDK/ndk" || true
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties

      - name: Install ccache
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ABI }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.ABI }}-

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.ABI }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ env.ABI }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ env.ABI }}-

      # Кэш нативной сборки (CMake/NDK) — главное ускорение повторных запусков
      - name: Native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: cxx-${{ env.ABI }}-${{ hashFiles('TMessagesProj/jni/**/CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            cxx-${{ env.ABI }}-${{ hashFiles('TMessagesProj/jni/**/CMakeLists.txt', '.gitmodules') }}-
            cxx-${{ env.ABI }}-

      # Keystore. По умолчанию — ключ из репозитория (пароли android/android).
      # Свой ключ: секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}
        run: |
          ENC=TMessagesProj/config/pengram-release.keystore.enc
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
            {
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-pengram}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "RELEASE_STORE_TYPE=${KEYSTORE_TYPE:-pkcs12}"
            } >> gradle.properties
            echo "Используется пользовательский keystore из секрета KEYSTORE_BASE64"
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f "$ENC" ]; then
            # Простой путь для телефона: сам ключ лежит в репозитории зашифрованным,
            # в секретах достаточно одного пароля. Без пароля файл бесполезен.
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 400000 -in "$ENC" \
                 -out TMessagesProj/config/release.keystore -pass env:KEYSTORE_PASSWORD; then
              echo "::error::Не удалось расшифровать $ENC — неверный секрет KEYSTORE_PASSWORD. См. docs/KEYSTORE.md"
              exit 1
            fi
            {
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-pengram}"
              echo "RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_STORE_TYPE=pkcs12"
            } >> gradle.properties
            echo "Используется собственный ключ Pengram (зашифрован в репозитории)"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Публичный релиз ключом из репозитория подписывать нельзя: этим ключом
            # владеет кто угодно, кто видел исходники, и он сможет выпустить
            # «обновление» поверх беты. Инструкция: docs/KEYSTORE.md
            echo "::error::Релизный тег, а подписывать нечем: нет ни секрета KEYSTORE_PASSWORD (к зашифрованному ключу в репозитории), ни KEYSTORE_BASE64. Сгенерируйте свой ключ (scripts/new-keystore.sh) и добавьте секреты KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD. Подробности: docs/KEYSTORE.md"
            exit 1
          else
            echo "::warning::Сборка подписана тестовым ключом из репозитория — ставить поверх неё релиз не получится. См. docs/KEYSTORE.md"
          fi

      - name: Prepare API keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          SAFETYNET_KEY: ${{ secrets.SAFETYNET_KEY }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "::error::Не заданы секреты APP_ID / APP_HASH. Settings -> Secrets and variables -> Actions -> New repository secret. Ключи берутся на https://my.telegram.org"
            exit 1
          fi
          {
            echo "APP_ID=$APP_ID"
            echo "APP_HASH=$APP_HASH"
            echo "SAFETYNET_KEY=$SAFETYNET_KEY"
            echo "GOOGLE_AUTH_CLIENT_ID=$GOOGLE_AUTH_CLIENT_ID"
          } > api.properties
          echo "api.properties создан, значения не печатаются"

      - name: Build APK
        shell: bash
        run: |
          set -ux
          chmod +x ./gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            TASK=":TMessagesProj_AppStandalone:assembleAfatDebug"
          else
            TASK=":TMessagesProj_AppStandalone:assembleAfatStandalone"
          fi
          set +e
          ./gradlew "$TASK" \
            -PABI_FILTERS="$ABI" \
            --no-daemon --stacktrace \
            --build-cache --parallel --max-workers=4 \
            -Pandroid.lint.checkReleaseBuilds=false \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            -Dfile.encoding=UTF-8 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != "0" ]; then
            {
              echo '### Build failed'
              echo '```'
              tail -n 200 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      - name: Verify Pengram code is obfuscated
        if: env.BUILD_TYPE == 'standalone'
        shell: bash
        run: |
          set -euo pipefail
          # Never publish mapping.txt: it reverses the R8 renaming. A compile
          # success alone does not prove our broad Telegram keep rules are safe.
          found=0
          for class in \
            org.telegram.messenger.PengramAIClient \
            org.telegram.messenger.PengramAntiCrash \
            org.telegram.messenger.PengramVoiceChanger \
            org.telegram.ui.Components.PengramQuoteMaker; do
            original="${class//./\\.}"
            line=''
            while IFS= read -r map; do
              line=$(grep -m1 -E "^${original} -> " "$map" || true)
              if [ -n "$line" ]; then break; fi
            done < <(find TMessagesProj/build/outputs/mapping TMessagesProj_AppStandalone/build/outputs/mapping -name mapping.txt -type f 2>/dev/null || true)
            if [ -z "$line" ]; then
              echo "::error::No R8 mapping for $class"
              exit 1
            fi
            mapped="${line#* -> }"
            mapped="${mapped%:}"
            if [ "$mapped" = "$class" ]; then
              echo "::error::$class was not renamed by R8"
              exit 1
            fi
            # AGP may emit a library mapping before the app mapping; package
            # relocation is best-effort, unlike class renaming, which we require.
            if [[ "$mapped" != p.* ]]; then
              echo "::warning::$class renamed but not relocated by this R8 stage"
            fi
            found=$((found + 1))
          done
          echo "$found fork classes renamed by R8; mapping stays on the runner."
          # Unlike ordinary fork classes, WebRTC loads this JNI bridge by its
          # literal Java name. Renaming it makes an audio call abort in native code.
          bridge='org.telegram.messenger.AudioEffectBridge'
          found_bridge=0
          while IFS= read -r map; do
            line=$(grep -m1 -F "${bridge} -> " "$map" || true)
            if [ -n "$line" ]; then
              mapped="${line#* -> }"
              mapped="${mapped%:}"
              if [ "$mapped" != "$bridge" ]; then
                echo "::error::WebRTC JNI voice bridge was renamed by R8"
                exit 1
              fi
              found_bridge=1
            fi
          done < <(find TMessagesProj/build/outputs/mapping TMessagesProj_AppStandalone/build/outputs/mapping -name mapping.txt -type f 2>/dev/null || true)
          if [ "$found_bridge" -ne 1 ]; then
            echo "::error::No R8 mapping for WebRTC JNI voice bridge"
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats || true
          { echo "### ccache"; echo '```'; ccache --show-stats || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          set -eux
          mkdir -p out
          find TMessagesProj_AppStandalone/build/outputs/apk -name "*.apk" -exec sh -c \
            'cp "$1" "out/Pengram-${BUILD_TYPE}-${ABI%%,*}-run${GITHUB_RUN_NUMBER}.apk"' _ {} \;
          ls -lh out

      # Отпечаток ключа печатаем в лог: так видно, что релиз подписан тем же ключом,
      # что и прошлый, и обновление поверх встанет.
      - name: Show signing fingerprint
        continue-on-error: true
        run: |
          APK=$(ls out/*.apk | head -n 1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pengram-ARM64-${{ env.BUILD_TYPE }}-run-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta release
        # тег build-* -> готовый релиз с APK, это и есть публикация беты
        if: startsWith(github.ref, 'refs/tags/build-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: "Pengram ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true

      - name: Report build errors
        if: failure() && hashFiles('build.log') != ''
        run: |
          grep -nE "error:|e: |^FAILURE|What went wrong|Execution failed" build.log | tail -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Upload build log on failure
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/.cxx/**/*.log
          if-no-files-found: ignore
          retention-days: 7
