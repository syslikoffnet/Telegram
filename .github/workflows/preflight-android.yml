name: Android Java preflight
on:
  push:
    branches:
      - "arena/01a10249-telegram"
      - "arena/01a105ae-telegram"
      - "arena/01a10850-telegram"
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
      - name: Prepare API keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          SAFETYNET_KEY: ${{ secrets.SAFETYNET_KEY }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "::warning::Секреты APP_ID / APP_HASH не заданы — проверяем только компиляцию, APK из такой сборки войти в Telegram не сможет."
            exit 0
          fi
          {
            echo "APP_ID=$APP_ID"
            echo "APP_HASH=$APP_HASH"
            echo "SAFETYNET_KEY=$SAFETYNET_KEY"
            echo "GOOGLE_AUTH_CLIENT_ID=$GOOGLE_AUTH_CLIENT_ID"
          } > api.properties
          echo "api.properties создан, значения не печатаются"

      - name: Compile Java
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj:compileStandaloneJavaWithJavac --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" 2>&1 | tee build.log

      # Скачать логи job'а через API получается не всегда, поэтому ошибки компиляции
      # дублируем аннотациями и артефактом — их видно и без доступа к сырому логу.
      - name: Report compile errors
        if: failure()
        run: |
          grep -nE "error:|^FAILURE|What went wrong|Execution failed" build.log | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload compile log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-log
          path: build.log
          retention-days: 7
